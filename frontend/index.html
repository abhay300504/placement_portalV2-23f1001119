<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlacementPortal — Campus Recruitment</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', sans-serif; font-size: 14px; background: #f4f6fb; color: #1a1d23; }
    #app { min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; }
    ::-webkit-scrollbar-thumb { background: #c5c8d6; border-radius: 3px; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 260px; min-height: 100vh;
      background: #fff; border-right: 1px solid #eaecf0;
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; z-index: 100;
    }
    .sidebar-logo {
      padding: 22px 24px 18px;
      border-bottom: 1px solid #eaecf0;
      font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;
    }
    .sidebar-logo span:first-child { color: #5b21b6; }
    .sidebar-logo span:last-child  { color: #1a1d23; }

    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #9ca3af; padding: 10px 12px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; margin-bottom: 2px;
      color: #6b7280; font-size: 0.88rem; font-weight: 500; cursor: pointer;
      transition: all 0.15s;
    }
    .nav-item:hover { background: #f5f3ff; color: #5b21b6; }
    .nav-item.active { background: #ede9fe; color: #5b21b6; font-weight: 600; }
    .nav-item i { font-size: 1rem; width: 18px; }

    .sidebar-footer { padding: 14px; border-top: 1px solid #eaecf0; }

    /* ── TOPBAR ── */
    .app-shell { display: flex; min-height: 100vh; }
    .main-wrap { flex: 1; margin-left: 260px; display: flex; flex-direction: column; }
    .topbar {
      height: 60px; background: #fff; border-bottom: 1px solid #eaecf0;
      display: flex; align-items: center; padding: 0 28px;
      position: sticky; top: 0; z-index: 90; gap: 14px;
    }
    .topbar-left { flex: 1; }
    .page-heading { font-size: 1.35rem; font-weight: 700; color: #1a1d23; letter-spacing: -0.3px; }
    .page-sub { font-size: 0.8rem; color: #9ca3af; margin-top: 1px; }

    /* User dropdown */
    .user-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px; border-radius: 10px; cursor: pointer;
      border: 1.5px solid #ede9fe; background: #fff; transition: all 0.15s;
      position: relative;
    }
    .user-btn:hover { background: #f5f3ff; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: #5b21b6; color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
    }
    .user-name { font-size: 0.85rem; font-weight: 600; color: #1a1d23; }
    .user-role { font-size: 0.7rem; color: #9ca3af; text-transform: capitalize; }
    .user-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: #fff; border: 1px solid #eaecf0; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1); min-width: 220px; z-index: 999;
      overflow: hidden;
    }
    .dropdown-header { padding: 14px 16px; border-bottom: 1px solid #eaecf0; display: flex; align-items: center; gap: 10px; }
    .dropdown-item-btn { display: flex; align-items: center; gap: 10px; padding: 11px 16px; cursor: pointer; color: #374151; font-size: 0.87rem; transition: background 0.1s; }
    .dropdown-item-btn:hover { background: #f9fafb; }
    .dropdown-item-btn.danger { color: #dc2626; }
    .dropdown-item-btn.danger:hover { background: #fef2f2; }
    .dropdown-divider { height: 1px; background: #eaecf0; margin: 4px 0; }

    /* ── PAGE BODY ── */
    .page-body { padding: 24px 28px; flex: 1; }

    /* ── ALERT BANNER ── */
    .alert-banner {
      background: #f0fdf4; border-left: 4px solid #22c55e;
      border-radius: 8px; padding: 12px 16px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 0.85rem; color: #15803d;
    }

    /* ── STAT CARDS ── */
    .stat-card {
      background: #fff; border: 1px solid #eaecf0; border-radius: 14px;
      padding: 20px; transition: all 0.2s;
    }
    .stat-card:hover { box-shadow: 0 4px 16px rgba(91,33,182,0.08); transform: translateY(-2px); }
    .stat-icon {
      width: 46px; height: 46px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .stat-num { font-size: 2rem; font-weight: 800; color: #1a1d23; letter-spacing: -1px; margin-top: 12px; }
    .stat-lbl { font-size: 0.78rem; color: #9ca3af; margin-top: 3px; font-weight: 500; }

    /* ── CARDS ── */
    .card-box {
      background: #fff; border: 1px solid #eaecf0; border-radius: 14px;
      overflow: hidden;
    }
    .card-head {
      padding: 16px 20px; border-bottom: 1px solid #eaecf0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title { font-size: 0.95rem; font-weight: 700; color: #1a1d23; display: flex; align-items: center; gap: 8px; }

    /* ── TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th {
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: #9ca3af;
      padding: 11px 20px; border-bottom: 1px solid #eaecf0;
      text-align: left; background: #fafafa; white-space: nowrap;
    }
    .data-table td {
      padding: 13px 20px; border-bottom: 1px solid #f3f4f6;
      font-size: 0.86rem; color: #374151; vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #fafafa; }

    /* ── FILTER TABS ── */
    .filter-tabs { display: flex; gap: 6px; padding: 20px 20px 0; flex-wrap: wrap; }
    .filter-tab {
      padding: 6px 16px; border-radius: 20px; border: 1.5px solid #e5e7eb;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s;
      color: #6b7280; background: #fff;
    }
    .filter-tab:hover { border-color: #5b21b6; color: #5b21b6; }
    .filter-tab.active { background: #5b21b6; border-color: #5b21b6; color: #fff; }

    /* ── BADGES ── */
    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge-green   { background: #dcfce7; color: #15803d; }
    .badge-orange  { background: #ffedd5; color: #c2410c; }
    .badge-red     { background: #fee2e2; color: #dc2626; }
    .badge-blue    { background: #dbeafe; color: #1d4ed8; }
    .badge-purple  { background: #ede9fe; color: #5b21b6; }
    .badge-gray    { background: #f3f4f6; color: #6b7280; }

    /* ── BUTTONS ── */
    .btn-purple {
      background: #5b21b6; color: #fff; border: none;
      padding: 8px 18px; border-radius: 8px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.84rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s;
    }
    .btn-purple:hover { background: #4c1d95; box-shadow: 0 3px 10px rgba(91,33,182,0.3); }
    .btn-outline {
      background: #fff; border: 1.5px solid #e5e7eb; color: #374151;
      padding: 7px 14px; border-radius: 8px; font-weight: 500;
      font-family: 'Inter', sans-serif; font-size: 0.83rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s;
    }
    .btn-outline:hover { border-color: #5b21b6; color: #5b21b6; background: #f5f3ff; }
    .btn-view {
      background: #fff; border: 1.5px solid #e5e7eb; color: #374151;
      padding: 5px 12px; border-radius: 7px; font-weight: 500;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s;
    }
    .btn-view:hover { border-color: #5b21b6; color: #5b21b6; }
    .btn-close-drive {
      background: #f97316; border: none; color: #fff;
      padding: 5px 14px; border-radius: 7px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .btn-close-drive:hover { background: #ea580c; }
    .btn-approve {
      background: #dcfce7; border: 1px solid #86efac; color: #15803d;
      padding: 5px 12px; border-radius: 7px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
    }
    .btn-approve:hover { background: #bbf7d0; }
    .btn-reject {
      background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626;
      padding: 5px 12px; border-radius: 7px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
    }
    .btn-reject:hover { background: #fecaca; }
    .btn-danger-sm {
      background: #fff; border: 1.5px solid #fca5a5; color: #dc2626;
      padding: 5px 12px; border-radius: 7px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
    }
    .btn-success-sm {
      background: #fff; border: 1.5px solid #86efac; color: #15803d;
      padding: 5px 12px; border-radius: 7px; font-weight: 600;
      font-family: 'Inter', sans-serif; font-size: 0.8rem; cursor: pointer;
    }

    /* ── FORMS ── */
    .field-label { font-size: 0.78rem; font-weight: 600; color: #374151; margin-bottom: 5px; display: block; }
    .field-input {
      width: 100%; background: #fff; border: 1.5px solid #e5e7eb;
      border-radius: 8px; padding: 9px 12px; font-family: 'Inter', sans-serif;
      font-size: 0.86rem; color: #1a1d23; transition: border-color 0.15s;
    }
    .field-input:focus { outline: none; border-color: #5b21b6; box-shadow: 0 0 0 3px rgba(91,33,182,0.08); }
    .field-input::placeholder { color: #9ca3af; }
    .field-select {
      width: 100%; background: #fff; border: 1.5px solid #e5e7eb;
      border-radius: 8px; padding: 9px 12px; font-family: 'Inter', sans-serif;
      font-size: 0.86rem; color: #1a1d23;
    }
    .field-select:focus { outline: none; border-color: #5b21b6; }
    .field-textarea {
      width: 100%; background: #fff; border: 1.5px solid #e5e7eb;
      border-radius: 8px; padding: 9px 12px; font-family: 'Inter', sans-serif;
      font-size: 0.86rem; color: #1a1d23; resize: vertical;
    }
    .field-textarea:focus { outline: none; border-color: #5b21b6; }

    /* Search bar */
    .search-bar { position: relative; }
    .search-bar i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
    .search-bar input { padding-left: 32px !important; }

    /* ── AUTH ── */
    .auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f5f3ff 0%, #f4f6fb 60%, #eff6ff 100%);
    }
    .auth-box {
      background: #fff; border: 1px solid #eaecf0; border-radius: 16px;
      padding: 60px 40px; width: 100%; max-width: 440px;
      box-shadow: 0 8px 30px rgba(91,33,182,0.08);
    }
    .auth-brand { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; text-align: center; margin-bottom: 4px; }
    .auth-brand span:first-child { color: #5b21b6; }
    .auth-sub { text-align: center; color: #9ca3af; font-size: 0.85rem; margin-bottom: 28px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: #fff; border-radius: 16px; width: 100%; max-width: 500px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15); overflow: hidden;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-head {
      padding: 16px 20px; border-bottom: 1px solid #eaecf0;
      display: flex; align-items: center; justify-content: space-between;
      background: #fafafa; position: sticky; top: 0;
    }
    .modal-title { font-size: 0.95rem; font-weight: 700; color: #1a1d23; }
    .modal-body { padding: 24px; }
    .modal-foot { padding: 14px 20px; border-top: 1px solid #eaecf0; display: flex; justify-content: flex-end; gap: 8px; }

    /* ── DRIVE CARD ── */
    .drive-card {
      background: #fff; border: 1.5px solid #eaecf0; border-radius: 12px;
      padding: 18px; cursor: pointer; transition: all 0.2s;
    }
    .drive-card:hover { border-color: #5b21b6; box-shadow: 0 4px 14px rgba(91,33,182,0.1); }
    .drive-company-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9ca3af; margin-bottom: 3px; }
    .drive-title { font-size: 0.95rem; font-weight: 700; color: #1a1d23; margin-bottom: 10px; }

    /* ── INFO ROWS ── */
    .info-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .info-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; color: #6b7280; }

    /* ── LOADING ── */
    .spinner { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #e5e7eb; border-top-color: #5b21b6; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-box { display: flex; align-items: center; justify-content: center; padding: 60px; }
    .empty-box { text-align: center; padding: 48px; }
    .empty-box i { font-size: 2.5rem; color: #d1d5db; display: block; margin-bottom: 12px; }
    .empty-box p { color: #9ca3af; font-size: 0.88rem; }

    /* ── TOAST ── */
    .toast-wrap { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast-item {
      background: #fff; border: 1px solid #eaecf0; border-radius: 10px;
      padding: 12px 16px; font-size: 0.85rem; max-width: 320px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1); animation: slideUp 0.3s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .toast-item.success { border-left: 3px solid #22c55e; }
    .toast-item.error   { border-left: 3px solid #ef4444; }
    .toast-item.info    { border-left: 3px solid #5b21b6; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ── DETAIL FIELD ── */
    .detail-group { margin-bottom: 16px; }
    .detail-lbl { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #9ca3af; margin-bottom: 3px; }
    .detail-val { font-size: 0.88rem; color: #1a1d23; font-weight: 500; }

    /* Applicant count bubble */
    .count-bubble {
      width: 26px; height: 26px; border-radius: 50%; background: #ede9fe; color: #5b21b6;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.75rem; font-weight: 700;
    }

    @media (max-width: 768px) { .sidebar { transform: translateX(-100%); } .main-wrap { margin-left: 0; } }
  </style>
</head>
<body>
<div id="app"></div>

<!-- Store -->
<script src="src/store.js"></script>

<!-- Auth -->
<script src="src/components/Auth/Login.js"></script>
<script src="src/components/Auth/Register.js"></script>

<!-- Shared -->
<script src="src/components/Shared/Sidebar.js"></script>
<script src="src/components/Shared/Toast.js"></script>

<!-- Admin -->
<script src="src/components/Admin/AdminDashboard.js"></script>
<script src="src/components/Admin/AdminCompanies.js"></script>
<script src="src/components/Admin/AdminStudents.js"></script>
<script src="src/components/Admin/AdminDrives.js"></script>
<script src="src/components/Admin/AdminApplications.js"></script>
<script src="src/components/Admin/AdminSearch.js"></script>
<script src="src/components/Admin/AdminCompanyDetail.js"></script>
<script src="src/components/Admin/AdminDriveDetail.js"></script>

<!-- Company -->
<script src="src/components/Company/CompanyDashboard.js"></script>
<script src="src/components/Company/CompanyDrives.js"></script>
<script src="src/components/Company/CompanyApplications.js"></script>
<script src="src/components/Company/CompanyProfile.js"></script>

<!-- Student -->
<script src="src/components/Student/StudentDashboard.js"></script>
<script src="src/components/Student/StudentDrives.js"></script>
<script src="src/components/Student/StudentDriveDetail.js"></script>
<script src="src/components/Student/StudentApplications.js"></script>
<script src="src/components/Student/StudentProfile.js"></script>

<!-- Router & App -->
<script src="src/router.js"></script>
<script src="src/main.js"></script>

</body>
</html>
