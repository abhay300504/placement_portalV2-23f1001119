<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlacementHub — Campus Recruitment Portal</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Vue 3 CDN -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

  <!-- Vue Router CDN -->
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <style>
    /* ═══════════════════════════════════════════════
       DESIGN SYSTEM — VARIABLES
    ═══════════════════════════════════════════════ */
    :root {
      --bg:         #0d0f14;
      --bg2:        #13161e;
      --bg3:        #1a1e2a;
      --surface:    #1e2330;
      --border:     #2a2f3d;
      --accent:     #4f8cff;
      --accent2:    #7c5cfc;
      --success:    #22c55e;
      --warning:    #f59e0b;
      --danger:     #ef4444;
      --text:       #e8ecf4;
      --text-muted: #6b7591;
      --font-head:  'Syne', sans-serif;
      --font-body:  'DM Sans', sans-serif;
      --radius:     12px;
      --radius-lg:  20px;
      --shadow:     0 8px 32px rgba(0,0,0,0.4);
      --glow:       0 0 24px rgba(79,140,255,0.15);
    }

    /* ═══════════════════════════════════════════════
       BASE RESET
    ═══════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); }
    #app { min-height: 100vh; }
    h1,h2,h3,h4,h5,h6 { font-family: var(--font-head); }
    a { text-decoration: none; color: inherit; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ═══════════════════════════════════════════════
       LAYOUT
    ═══════════════════════════════════════════════ */
    .app-shell { display: flex; min-height: 100vh; }

    /* Sidebar */
    .sidebar {
      width: 260px; min-height: 100vh;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; z-index: 100;
      transition: transform 0.3s ease;
    }
    .sidebar-brand {
      padding: 28px 24px 20px;
      border-bottom: 1px solid var(--border);
    }
    .brand-logo {
      font-family: var(--font-head);
      font-size: 1.5rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub { font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.15em; text-transform: uppercase; margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 16px 12px; overflow-y: auto; }
    .nav-section-label {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 12px 12px 6px;
    }
    .nav-item { margin-bottom: 2px; }
    .nav-link-custom {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; border-radius: var(--radius);
      color: var(--text-muted); font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s ease;
      border: 1px solid transparent;
    }
    .nav-link-custom:hover { background: var(--surface); color: var(--text); }
    .nav-link-custom.active {
      background: linear-gradient(135deg, rgba(79,140,255,0.15), rgba(124,92,252,0.15));
      border-color: rgba(79,140,255,0.3);
      color: var(--accent);
    }
    .nav-link-custom i { font-size: 1rem; width: 18px; }
    .sidebar-footer {
      padding: 16px; border-top: 1px solid var(--border);
    }
    .user-pill {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: var(--radius);
      background: var(--surface); cursor: pointer;
    }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; font-family: var(--font-head);
      flex-shrink: 0;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-role { font-size: 0.7rem; color: var(--text-muted); text-transform: capitalize; }

    /* Main Content */
    .main-content { flex: 1; margin-left: 260px; min-height: 100vh; }
    .topbar {
      height: 64px; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 28px; position: sticky; top: 0; z-index: 90;
      gap: 16px;
    }
    .topbar-title { font-family: var(--font-head); font-size: 1.2rem; font-weight: 700; flex: 1; }
    .page-body { padding: 28px; }

    /* ═══════════════════════════════════════════════
       CARDS & SURFACES
    ═══════════════════════════════════════════════ */
    .card-dark {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden;
    }
    .card-dark .card-header-custom {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-dark .card-body-custom { padding: 24px; }

    .stat-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px;
      transition: all 0.3s ease; cursor: default;
    }
    .stat-card:hover { border-color: var(--accent); box-shadow: var(--glow); transform: translateY(-2px); }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; margin-bottom: 16px;
    }
    .stat-value { font-family: var(--font-head); font-size: 2.2rem; font-weight: 800; line-height: 1; }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.08em; }

    /* ═══════════════════════════════════════════════
       FORMS
    ═══════════════════════════════════════════════ */
    .form-control-dark, .form-select-dark {
      background: var(--surface) !important;
      border: 1px solid var(--border) !important;
      color: var(--text) !important;
      border-radius: 8px !important;
      padding: 10px 14px !important;
      font-family: var(--font-body) !important;
      transition: border-color 0.2s !important;
    }
    .form-control-dark:focus, .form-select-dark:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(79,140,255,0.15) !important;
      outline: none !important;
    }
    .form-control-dark::placeholder { color: var(--text-muted) !important; }
    .form-label-dark { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    .form-select-dark option { background: var(--surface); }

    /* ═══════════════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════════════ */
    .btn-primary-custom {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none; color: white; font-weight: 600;
      padding: 10px 20px; border-radius: 8px;
      font-family: var(--font-body); cursor: pointer;
      transition: all 0.2s ease; font-size: 0.9rem;
    }
    .btn-primary-custom:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(79,140,255,0.35); }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border);
      color: var(--text); font-weight: 500;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      font-family: var(--font-body); transition: all 0.2s ease; font-size: 0.88rem;
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success-custom {
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.4);
      color: var(--success); padding: 6px 14px; border-radius: 6px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: var(--font-body); transition: all 0.2s;
    }
    .btn-success-custom:hover { background: rgba(34,197,94,0.25); }
    .btn-danger-custom {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.35);
      color: var(--danger); padding: 6px 14px; border-radius: 6px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer;
      font-family: var(--font-body); transition: all 0.2s;
    }
    .btn-danger-custom:hover { background: rgba(239,68,68,0.2); }

    /* ═══════════════════════════════════════════════
       BADGES
    ═══════════════════════════════════════════════ */
    .badge-custom {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.04em;
    }
    .badge-pending   { background: rgba(245,158,11,0.15); color: var(--warning); border: 1px solid rgba(245,158,11,0.3); }
    .badge-approved  { background: rgba(34,197,94,0.12); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
    .badge-rejected  { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
    .badge-applied   { background: rgba(79,140,255,0.12); color: var(--accent); border: 1px solid rgba(79,140,255,0.3); }
    .badge-shortlisted { background: rgba(124,92,252,0.12); color: var(--accent2); border: 1px solid rgba(124,92,252,0.3); }
    .badge-selected  { background: rgba(34,197,94,0.12); color: var(--success); border: 1px solid rgba(34,197,94,0.3); }
    .badge-closed    { background: rgba(107,117,145,0.15); color: var(--text-muted); border: 1px solid rgba(107,117,145,0.3); }

    /* ═══════════════════════════════════════════════
       TABLE
    ═══════════════════════════════════════════════ */
    .table-dark-custom { width: 100%; border-collapse: collapse; }
    .table-dark-custom th {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      text-align: left; white-space: nowrap;
    }
    .table-dark-custom td {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      font-size: 0.88rem; color: var(--text); vertical-align: middle;
    }
    .table-dark-custom tr:last-child td { border-bottom: none; }
    .table-dark-custom tr:hover td { background: rgba(255,255,255,0.02); }

    /* ═══════════════════════════════════════════════
       ALERTS / TOAST
    ═══════════════════════════════════════════════ */
    .toast-container {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
    }
    .toast-msg {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      font-size: 0.88rem; max-width: 340px; box-shadow: var(--shadow);
      animation: slideIn 0.3s ease;
      display: flex; align-items: center; gap: 10px;
    }
    .toast-msg.success { border-left: 3px solid var(--success); }
    .toast-msg.error   { border-left: 3px solid var(--danger); }
    .toast-msg.info    { border-left: 3px solid var(--accent); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ═══════════════════════════════════════════════
       AUTH PAGES
    ═══════════════════════════════════════════════ */
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      background-image: radial-gradient(ellipse at 20% 50%, rgba(79,140,255,0.06) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 20%, rgba(124,92,252,0.06) 0%, transparent 60%);
    }
    .auth-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 40px;
      width: 100%; max-width: 460px; box-shadow: var(--shadow);
    }
    .auth-logo {
      font-family: var(--font-head); font-size: 2rem; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      text-align: center; margin-bottom: 4px;
    }
    .auth-tagline { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 32px; }

    /* ═══════════════════════════════════════════════
       DRIVE CARD
    ═══════════════════════════════════════════════ */
    .drive-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px;
      transition: all 0.25s ease;
    }
    .drive-card:hover { border-color: rgba(79,140,255,0.4); box-shadow: var(--glow); }
    .drive-company { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
    .drive-title { font-family: var(--font-head); font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
    .drive-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .drive-meta-item { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

    /* ═══════════════════════════════════════════════
       SEARCH INPUT
    ═══════════════════════════════════════════════ */
    .search-wrap { position: relative; }
    .search-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; }
    .search-wrap input { padding-left: 36px !important; }

    /* ═══════════════════════════════════════════════
       LOADING
    ═══════════════════════════════════════════════ */
    .spinner-ring {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-center { display: flex; align-items: center; justify-content: center; padding: 60px; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state i { font-size: 3rem; color: var(--border); margin-bottom: 16px; display: block; }
    .empty-state p { color: var(--text-muted); font-size: 0.9rem; }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; }
    }

    /* Transitions */
    .fade-enter-active, .fade-leave-active { transition: opacity 0.2s; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
  </style>
</head>
<body>
<div id="app"></div>

<script src="src/components/Company/CompanyDashboard.js"></script>
<script src="src/components/Company/CompanyDrives.js"></script>
<script src="src/components/Company/CompanyApplications.js"></script>
<script src="src/components/Company/CompanyProfile.js"></script>
<script src="src/components/Student/StudentDashboard.js"></script>
<script src="src/components/Student/StudentDrives.js"></script>

<script src="src/main.js"></script>
</body>
